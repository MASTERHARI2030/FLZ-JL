<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Anzan Memory Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Neural Speed Training</p>
          <h1>Flash Anzan Memory</h1>
        </div>
        <button id="startBtn" class="primary-btn">Start Session</button>
      </header>

      <main class="dashboard">
        <aside class="panel controls-panel">
          <h2>Session Controls</h2>

          <label class="field">
            <span>Game mode</span>
            <select id="modeSelect">
              <option value="recall">Recall</option>
              <option value="reverse">Reverse Recall</option>
              <option value="sum">Sum Sprint</option>
              <option value="equation">Equation Solve</option>
            </select>
          </label>

          <label class="field">
            <span>Difficulty</span>
            <select id="difficultySelect">
              <option value="1">Warmup</option>
              <option value="2">Steady</option>
              <option value="3">Advanced</option>
              <option value="4">Expert</option>
              <option value="5">Elite</option>
            </select>
          </label>

          <div class="slider-group">
            <label for="flashSpeed">
              <span>Flash speed</span>
              <strong id="flashSpeedValue">900 ms</strong>
            </label>
            <input id="flashSpeed" type="range" min="350" max="1800" step="50" value="900" />
          </div>

          <div class="slider-group">
            <label for="answerWindow">
              <span>Answer window</span>
              <strong id="answerWindowValue">8.0 s</strong>
            </label>
            <input id="answerWindow" type="range" min="3" max="15" step="0.5" value="8" />
          </div>

          <div class="toggle-row">
            <label class="switch">
              <input id="soundToggle" type="checkbox" checked />
              <span class="slider"></span>
            </label>
            <span>Sound FX</span>
          </div>

          <div class="toggle-row">
            <label class="switch">
              <input id="strictToggle" type="checkbox" />
              <span class="slider"></span>
            </label>
            <span>Strict mode</span>
          </div>

          <div class="button-stack">
            <button id="pauseBtn" class="secondary-btn">Pause</button>
            <button id="resetBtn" class="secondary-btn ghost">Reset</button>
          </div>
        </aside>

        <section class="panel main-panel">
          <div class="status-row">
            <div class="status-pill">
              <span>Level</span>
              <strong id="levelValue">1</strong>
            </div>
            <div class="status-pill">
              <span>Streak</span>
              <strong id="streakValue">0</strong>
            </div>
            <div class="status-pill">
              <span>Score</span>
              <strong id="scoreValue">0</strong>
            </div>
            <div class="status-pill danger">
              <span>Lives</span>
              <strong id="livesValue">3</strong>
            </div>
          </div>

          <div class="display-wrap">
            <div id="taskLabel" class="task-label">Memory challenge</div>
            <div id="flashDisplay" class="flash-display" aria-live="polite">Ready</div>
          </div>

          <div class="input-panel">
            <input
              id="answerInput"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              spellcheck="false"
              placeholder="Type your answer"
              disabled
            />
            <button id="submitBtn" class="primary-btn">Submit</button>
          </div>

          <div class="info-row">
            <div>
              <span class="label">Timer</span>
              <strong id="timerValue">0.0s</strong>
            </div>
            <div>
              <span class="label">Best</span>
              <strong id="bestValue">0</strong>
            </div>
            <div>
              <span class="label">Round</span>
              <strong id="roundValue">1</strong>
            </div>
          </div>

          <div id="message" class="message success">Choose a mode and hit start to begin.</div>
        </section>

        <aside class="panel stats-panel">
          <h2>Performance</h2>
          <div class="metric-list">
            <div class="metric-item">
              <span>Correct</span>
              <strong id="correctValue">0</strong>
            </div>
            <div class="metric-item">
              <span>Wrong</span>
              <strong id="wrongValue">0</strong>
            </div>
            <div class="metric-item">
              <span>Accuracy</span>
              <strong id="accuracyValue">0%</strong>
            </div>
            <div class="metric-item">
              <span>High Score</span>
              <strong id="highScoreValue">0</strong>
            </div>
          </div>

          <div class="leaderboard">
            <h3>Recent Results</h3>
            <ul id="historyList">
              <li>No runs yet</li>
            </ul>
          </div>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
